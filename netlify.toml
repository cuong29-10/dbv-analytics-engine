# Netlify chỉ phục vụ trang tĩnh trong thư mục web/. Không có bước build: các file .js là module ES
# chạy thẳng trên trình duyệt, không qua bundler.
[build]
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
