# Render Blueprint: nối repo GitHub, Render đọc file này và tự tạo service.
# Bốn ID Fabric điền tay trong Dashboard (Environment), không đưa vào repo.
services:
  - type: web
    name: dbv-analytics-engine
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DBV_BASE_URL
        value: https://dbv-analytics-engine.onrender.com
      - key: DBV_LOGIN_REQUIRED
        value: "1"
      - key: FABRIC_TENANTID
        sync: false
      - key: FABRIC_CLIENTID
        sync: false
      - key: FABRIC_WORKSPACEID
        sync: false
      - key: FABRIC_DATASETID
        sync: false
